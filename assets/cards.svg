<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="240" viewBox="0 0 1024 240" role="img" font-family='ui-monospace, &quot;SFMono-Regular&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace'>
<title>selected work</title><desc>four interactive project cards: hover to light them up</desc>
<style>
.card { transition: transform .28s cubic-bezier(.2,.7,.3,1.1); transform-box: fill-box; transform-origin: center }
.frame { transition: stroke .25s, filter .25s }
.card:hover .frame { filter: drop-shadow(0 6px 16px rgba(0,0,0,.55)) }
.url { opacity: 0; transition: opacity .25s, transform .25s; transform: translateX(-6px) }
.card:hover .url { opacity: 1; transform: translateX(0) }
#c1:hover .frame { stroke: #7C4DFF; }
#c1:hover { transform: translateY(-4px); }
#c2:hover .frame { stroke: #00D4FF; }
#c2:hover { transform: translateY(-4px); }
#c3:hover .frame { stroke: #33E1B5; }
#c3:hover { transform: translateY(-4px); }
#c4:hover .frame { stroke: #FFD166; }
#c4:hover { transform: translateY(-4px); }
</style>
<rect width="1024" height="240" fill="none"/>

  <g class="card" id="c1">
    <rect class="frame" x="40" y="12" width="488" height="104" rx="24" fill="#12151D" stroke="#2A2F3D"/>
    <rect x="56" y="32" width="4" height="64" rx="2" fill="#7C4DFF" opacity=".9"/>
    <text x="74" y="39" font-size="11" letter-spacing="2" fill="#6C7387">STAGE 01</text>
    <rect x="369" y="26" width="129" height="20" rx="10" fill="#7C4DFF" opacity=".12"/>
    <text x="498" y="40" font-size="10.5" fill="#7C4DFF" text-anchor="end" opacity=".95">KOTLIN·COMPOSE</text>
    <text x="74" y="68" font-size="22" font-weight="700" fill="#E6E8F0">kuro</text>
    <text x="74" y="92" font-size="12" fill="#9AA3B8">isolated app vault · import, run, forget</text>
    <text class="url" x="74" y="109" font-size="11" fill="#7FE3FF">github.com/vastobb/kuro</text>
    <g>
      <text x="498" y="68" font-size="21" font-weight="700" fill="#7C4DFF" text-anchor="end">4.8k</text>
      <text x="498" y="84" font-size="10.5" fill="#6C7387" text-anchor="end">loc</text>
      <text x="498" y="102" font-size="10.5" fill="#9AA3B8" text-anchor="end">63 files · 5 workflows</text>
    </g>
  </g>

  <g class="card" id="c2">
    <rect class="frame" x="536" y="12" width="488" height="104" rx="24" fill="#12151D" stroke="#2A2F3D"/>
    <rect x="552" y="32" width="4" height="64" rx="2" fill="#00D4FF" opacity=".9"/>
    <text x="570" y="39" font-size="11" letter-spacing="2" fill="#6C7387">STAGE 02</text>
    <rect x="888" y="26" width="106" height="20" rx="10" fill="#00D4FF" opacity=".12"/>
    <text x="994" y="40" font-size="10.5" fill="#00D4FF" text-anchor="end" opacity=".95">JAVA·C++·PY</text>
    <text x="570" y="68" font-size="22" font-weight="700" fill="#E6E8F0">ShadowAuto-Build</text>
    <text x="570" y="92" font-size="12" fill="#9AA3B8">virtual displays driven by tool calls</text>
    <text class="url" x="570" y="109" font-size="11" fill="#7FE3FF">github.com/vastobb/ShadowAuto-Build</text>
    <g>
      <text x="994" y="68" font-size="21" font-weight="700" fill="#00D4FF" text-anchor="end">42.9k</text>
      <text x="994" y="84" font-size="10.5" fill="#6C7387" text-anchor="end">loc</text>
      <text x="994" y="102" font-size="10.5" fill="#9AA3B8" text-anchor="end">268 files · ci pipeline</text>
    </g>
  </g>

  <g class="card" id="c3">
    <rect class="frame" x="40" y="124" width="488" height="104" rx="24" fill="#12151D" stroke="#2A2F3D"/>
    <rect x="56" y="144" width="4" height="64" rx="2" fill="#33E1B5" opacity=".9"/>
    <text x="74" y="151" font-size="11" letter-spacing="2" fill="#6C7387">STAGE 03</text>
    <rect x="400" y="138" width="98" height="20" rx="10" fill="#33E1B5" opacity=".12"/>
    <text x="498" y="152" font-size="10.5" fill="#33E1B5" text-anchor="end" opacity=".95">C++·PYTHON</text>
    <text x="74" y="180" font-size="22" font-weight="700" fill="#E6E8F0">fedora</text>
    <text x="74" y="204" font-size="12" fill="#9AA3B8">.so loader RE — ghidra runs in CI</text>
    <text class="url" x="74" y="221" font-size="11" fill="#7FE3FF">github.com/vastobb/fedora</text>
    <g>
      <text x="498" y="180" font-size="21" font-weight="700" fill="#33E1B5" text-anchor="end">3.0k</text>
      <text x="498" y="196" font-size="10.5" fill="#6C7387" text-anchor="end">loc</text>
      <text x="498" y="214" font-size="10.5" fill="#9AA3B8" text-anchor="end">26 files · 2 workflows</text>
    </g>
  </g>

  <g class="card" id="c4">
    <rect class="frame" x="536" y="124" width="488" height="104" rx="24" fill="#12151D" stroke="#2A2F3D"/>
    <rect x="552" y="144" width="4" height="64" rx="2" fill="#FFD166" opacity=".9"/>
    <text x="570" y="151" font-size="11" letter-spacing="2" fill="#6C7387">STAGE 04</text>
    <rect x="904" y="138" width="90" height="20" rx="10" fill="#FFD166" opacity=".12"/>
    <text x="994" y="152" font-size="10.5" fill="#FFD166" text-anchor="end" opacity=".95">JAVA·GLSL</text>
    <text x="570" y="180" font-size="22" font-weight="700" fill="#E6E8F0">onigiri</text>
    <text x="570" y="204" font-size="12" fill="#9AA3B8">temporal renderer for phone GPUs</text>
    <text class="url" x="570" y="221" font-size="11" fill="#7FE3FF">github.com/vastobb/onigiri</text>
    <g>
      <text x="994" y="180" font-size="21" font-weight="700" fill="#FFD166" text-anchor="end">4.9k</text>
      <text x="994" y="196" font-size="10.5" fill="#6C7387" text-anchor="end">loc</text>
      <text x="994" y="214" font-size="10.5" fill="#9AA3B8" text-anchor="end">32 files · shader gate</text>
    </g>
  </g>
</svg>
